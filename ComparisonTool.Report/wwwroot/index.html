<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comparison Report</title>
    <base href="./" />

    <!-- MudBlazor Fonts and Icons -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />

    <link rel="stylesheet" href="css/app.css" />
</head>
<body>
    <div id="app">
        <div style="display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column">
            <h3>Loading Comparison Report...</h3>
            <div style="margin-top:16px;width:200px;height:4px;background:#e0e0e0;border-radius:2px;overflow:hidden">
                <div style="width:40%;height:100%;background:#1976d2;border-radius:2px;animation:loading 1.5s ease-in-out infinite"></div>
            </div>
        </div>
        <style>
            @keyframes loading { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
        </style>
    </div>

    <div id="blazor-error-ui" style="display:none">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">&#x1f5d9;</a>
    </div>

    <script id="report-data" type="application/json">__REPORT_DATA_JSON__</script>

    <script>
        window.getReportData = function () {
            return document.getElementById('report-data').textContent;
        };
    </script>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_content/ComparisonTool.UI/js/app.js"></script>
</body>
</html>
