name: Build & Format & Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  validate:
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ComparisonTool.sln

      # - name: Format (whitespace only, verify no changes)
      #   run: dotnet format whitespace ComparisonTool.sln --verify-no-changes --verbosity minimal --exclude "ComparisonTool.Tests"

      - name: Build
        run: dotnet build ComparisonTool.sln --configuration Release --no-restore

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v3

      - name: Test
        run: dotnet test --solution ComparisonTool.sln --configuration Release --no-build --report-trx --coverage --coverage-output-format cobertura

      - name: Generate Retention Matrix Report
        if: always()
        shell: pwsh
        run: ./scripts/Generate-RetentionMatrixReport.ps1

      - name: Append Retention Matrix Summary
        if: always()
        shell: pwsh
        run: |
          $report = 'artifacts/ci/retention-matrix/RetentionMatrixReport.md'
          if (Test-Path $report) {
            "## Retention Matrix Report" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Get-Content -Path $report | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Upload Retention Matrix Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retention-matrix-report
          path: artifacts/ci/retention-matrix/**

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/TestResults/*.trx
            **/TestResults/*.cobertura.xml
